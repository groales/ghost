services:
  ghost:
    image: ghost:latest
    container_name: ghost
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # Config de URL base de Ghost
      url: http://localhost:2368
      # Config para SQLite3
      database__client: sqlite3
      database__connection__filename: content/data/ghost.db
      database__useNullAsDefault: "true"
      NODE_ENV: production
    ports:
      - 2368:2368
    volumes:
      - ./content:/var/lib/ghost/content

# Red predeterminada apuntando a la red externa 'proxy'
networks:
  default:
    external: true
    name: proxy
    